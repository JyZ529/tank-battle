<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>坦克大战 · Battle City</title>
<style>
  :root {
    --bg: #0a0a0a;
    --panel: #141414;
    --text: #e8e8e8;
    --accent: #f5c542;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: radial-gradient(circle at 50% 30%, #1a1a1a, #000 70%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    color: var(--text);
    user-select: none;
    overflow: hidden;
  }
  .wrap { display: flex; gap: 20px; align-items: flex-start; }
  .stage {
    background: var(--panel);
    padding: 10px;
    border-radius: 10px;
    box-shadow: 0 0 0 2px #2a2a2a, 0 20px 60px rgba(0,0,0,.6);
  }
  canvas { display: block; border-radius: 6px; image-rendering: pixelated; }
  .panel {
    width: 170px;
    background: var(--panel);
    border-radius: 10px;
    padding: 18px 16px;
    box-shadow: 0 0 0 2px #2a2a2a, 0 20px 60px rgba(0,0,0,.6);
  }
  .panel h1 {
    font-size: 20px;
    letter-spacing: 2px;
    color: var(--accent);
    margin-bottom: 14px;
    text-align: center;
  }
  .stat {
    display: flex;
    justify-content: space-between;
    padding: 8px 2px;
    border-bottom: 1px solid #262626;
    font-size: 14px;
  }
  .stat b { color: var(--accent); }
  .lives { margin: 12px 0; }
  .lives .label { font-size: 13px; color: #999; margin-bottom: 6px; }
  .lives .icons span {
    display: inline-block; width: 14px; height: 14px; margin-right: 5px;
    background: var(--accent); border-radius: 3px;
  }
  .enemy-remain { font-size: 13px; color: #999; margin: 12px 0; }
  .enemy-remain .dots span {
    display: inline-block; width: 10px; height: 10px; margin: 2px 3px 0 0;
    background: #c0392b; border-radius: 50%;
  }
  .hint {
    margin-top: 18px; font-size: 12px; color: #777; line-height: 1.8;
  }
  .hint kbd {
    background: #222; border: 1px solid #333; border-radius: 4px;
    padding: 1px 6px; font-size: 11px; color: #bbb;
  }
  .controls { display: flex; gap: 8px; margin-top: 16px; }
  button {
    flex: 1; padding: 10px 0; border: none; border-radius: 6px; cursor: pointer;
    font-size: 14px; font-weight: 600; letter-spacing: 1px;
    background: var(--accent); color: #1a1a1a; transition: transform .1s, filter .1s;
  }
  button:hover { filter: brightness(1.1); transform: translateY(-1px); }
  button:active { transform: translateY(0); }
  button.ghost { background: #2a2a2a; color: #ccc; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="stage">
      <canvas id="game" width="520" height="520"></canvas>
    </div>
    <div class="panel">
      <h1>坦克大战</h1>
      <div class="stat"><span>得分</span><b id="score">0</b></div>
      <div class="stat"><span>关卡</span><b id="level">1</b></div>
      <div class="lives">
        <div class="label">剩余生命</div>
        <div class="icons" id="lives"></div>
      </div>
      <div class="enemy-remain">
        <div class="label">剩余敌人</div>
        <div class="dots" id="enemies"></div>
      </div>
      <div class="hint">
        移动：<kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 或 方向键<br>
        射击：<kbd>空格</kbd> / <kbd>J</kbd><br>
        暂停：<kbd>P</kbd>
      </div>
      <div class="controls">
        <button id="btnStart" class="ghost">开始</button>
        <button id="btnPause" class="ghost">暂停</button>
      </div>
    </div>
  </div>

<script>
(() => {
  "use strict";

  // ---------- 常量 ----------
  const TILE = 40;                 // 每个格子的像素
  const COLS = 13, ROWS = 13;      // 13 x 13 战场
  const FIELD = TILE * COLS;       // 520
  const TANK = 36;                 // 坦克尺寸（略小于格子，方便平滑移动）
  const BULLET = 8;
  const TANK_SPEED = 2.2;          // 像素/帧
  const BULLET_SPEED = 6;
  const ENEMY_SPEED = 1.4;
  const PLAYER_LIVES = 3;
  const ENEMIES_PER_LEVEL = 12;    // 每关敌人总数
  const MAX_ALIVE_ENEMY = 4;       // 场上同时存在的敌人上限

  // 地图元素
  const EMPTY = 0, BRICK = 1, STEEL = 2, WATER = 3, TREE = 4, BASE = 5;

  // 方向：0上 1右 2下 3左
  const DIR = [
    { dx: 0,  dy: -1 },
    { dx: 1,  dy: 0  },
    { dx: 0,  dy: 1  },
    { dx: -1, dy: 0  },
  ];

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  // HUD 元素
  const elScore = document.getElementById('score');
  const elLevel = document.getElementById('level');
  const elLives = document.getElementById('lives');
  const elEnemies = document.getElementById('enemies');
  const btnStart = document.getElementById('btnStart');
  const btnPause = document.getElementById('btnPause');

  // ---------- 游戏状态 ----------
  let map = [];          // 2D 数组
  let player = null;
  let enemies = [];      // 场上敌人
  let bullets = [];
  let explosions = [];   // 爆炸特效
  let particles = [];
  let score = 0;
  let level = 1;
  let lives = PLAYER_LIVES;
  let enemiesLeft = ENEMIES_PER_LEVEL;   // 本关还需击毁数（含待出生）
  let spawnQueue = [];   // 待出生敌人类型
  let spawnTimer = 0;
  let gameState = 'menu';   // menu | playing | paused | over | win | levelclear
  let stateTimer = 0;
  let shake = 0;          // 屏幕震动
  let flashBase = 0;      // 基地被毁闪烁
  let playerInv = 0;      // 玩家无敌时间（出生保护）
  let lastTime = 0;

  const keys = {};
  const AUDIO = initAudio();

  // ---------- 地图定义 ----------
  // 经典 Battle City 风格地图（对称）
  const LEVELS = [
    // 第 1 关
    [
      ".............",
      ".b...b...b...b",
      ".b.s.b.b.s.b.b",
      ".b.s.b.b.s.b.b",
      ".b...b.b...b.b",
      "..bbb.b.bbb...",
      "....b...b.....",
      ".bb.b...b.bb..",
      ".bb.bbbbb.bb..",
      ".b.........b..",
      ".b.b.bbbb.b.b.",
      ".b.........b..",
      ".....bbb......",
    ],
    // 第 2 关
    [
      ".............",
      ".bb..bbb..bb.",
      ".b...b.b...b.",
      ".b.w.w.w.w.b.",
      ".b.w...b.w.b.",
      "..w.b...b.w..",
      "..w.wwwww.w..",
      ".bb.......bb.",
      ".b...s.s...b.",
      ".b.s.....s.b.",
      ".b...s.s...b.",
      ".bb.......bb.",
      ".....bbb......",
    ],
  ];

  function decodeLevel(rows) {
    const m = [];
    for (let r = 0; r < ROWS; r++) {
      const row = [];
      for (let c = 0; c < COLS; c++) {
        const ch = rows[r][c];
        row.push(ch === 'b' ? BRICK : ch === 's' ? STEEL : ch === 'w' ? WATER : ch === 't' ? TREE : EMPTY);
      }
      m.push(row);
    }
    // 基地（老鹰）放在底部中央
    m[ROWS - 1][6] = BASE;
    return m;
  }

  // ---------- 音频（Web Audio，无需外部文件） ----------
  function initAudio() {
    let ctxA = null;
    function ensure() {
      if (!ctxA) ctxA = new (window.AudioContext || window.webkitAudioContext)();
      if (ctxA.state === 'suspended') ctxA.resume();
      return ctxA;
    }
    function tone(freq, dur, type = 'square', vol = 0.08, slide = 0) {
      try {
        const a = ensure();
        const o = a.createOscillator();
        const g = a.createGain();
        o.type = type;
        o.frequency.setValueAtTime(freq, a.currentTime);
        if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), a.currentTime + dur);
        g.gain.setValueAtTime(vol, a.currentTime);
        g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
        o.connect(g); g.connect(a.destination);
        o.start(); o.stop(a.currentTime + dur);
      } catch (e) { /* 静默失败 */ }
    }
    return {
      shoot: () => tone(880, 0.08, 'square', 0.05, -400),
      explode: () => { tone(120, 0.25, 'sawtooth', 0.09, -80); tone(60, 0.3, 'triangle', 0.08, -40); },
      hitWall: () => tone(200, 0.05, 'square', 0.04),
      spawn: () => tone(440, 0.12, 'triangle', 0.06, 200),
      die: () => { tone(300, 0.4, 'sawtooth', 0.08, -260); },
      levelClear: () => { tone(523, 0.15, 'square', 0.06); setTimeout(() => tone(659, 0.15, 'square', 0.06), 150); setTimeout(() => tone(784, 0.25, 'square', 0.06), 300); },
    };
  }

  // ---------- 坦克 / 子弹 ----------
  function createTank(x, y, dir, isPlayer) {
    return {
      x, y, dir,
      speed: isPlayer ? TANK_SPEED : ENEMY_SPEED,
      isPlayer,
      alive: true,
      moveTick: 0,
      shootCooldown: 0,
      color: isPlayer ? 0 : (level % 2 === 0 ? 1 : 2), // 敌人颜色随关卡变化
    };
  }

  function createBullet(x, y, dir, isPlayer) {
    return { x, y, dir, isPlayer, speed: BULLET_SPEED, alive: true };
  }

  function spawnPlayer() {
    const cx = 6 * TILE + (TILE - TANK) / 2;   // 底部中央偏左（基地左边）
    const cy = 12 * TILE + (TILE - TANK) / 2;
    player = createTank(cx, cy, 0, true);
    playerInv = 120;
  }

  function buildSpawnQueue() {
    spawnQueue = [];
    // 每关敌人类型：普通 → 快速 → 强化，越往后越难
    for (let i = 0; i < ENEMIES_PER_LEVEL; i++) {
      const t = i < 5 ? 0 : i < 9 ? 1 : 2;
      spawnQueue.push(t);
    }
  }

  // ---------- 碰撞检测 ----------
  function tileAt(col, row) {
    if (col < 0 || row < 0 || col >= COLS || row >= ROWS) return STEEL; // 边界视为墙
    return map[row][col];
  }
  function isSolidForTank(v) {
    return v === BRICK || v === STEEL || v === WATER || v === BASE;
  }

  // 坦克能否移动到 (x, y)
  function tankCanMove(x, y, self) {
    if (x < 0 || y < 0 || x + TANK > FIELD || y + TANK > FIELD) return false;
    // 检查四个角覆盖的格子
    const c0 = Math.floor(x / TILE), r0 = Math.floor(y / TILE);
    const c1 = Math.floor((x + TANK - 1) / TILE), r1 = Math.floor((y + TANK - 1) / TILE);
    for (let r = r0; r <= r1; r++) {
      for (let c = c0; c <= c1; c++) {
        if (isSolidForTank(tileAt(c, r))) return false;
      }
    }
    // 检查与其他坦克的碰撞
    const tanks = self.isPlayer ? enemies : [player, ...enemies.filter(e => e !== self)];
    for (const t of tanks) {
      if (!t || !t.alive || t === self) continue;
      if (x < t.x + TANK && x + TANK > t.x && y < t.y + TANK && y + TANK > t.y) return false;
    }
    return true;
  }

  function bulletHitTile(x, y) {
    const c = Math.floor(x / TILE), r = Math.floor(y / TILE);
    if (c < 0 || r < 0 || c >= COLS || r >= ROWS) return STEEL;
    return tileAt(c, r);
  }

  // ---------- 子弹逻辑 ----------
  function updateBullet(b) {
    if (!b.alive) return;
    for (let i = 0; i < b.speed; i++) {
      b.x += DIR[b.dir].dx;
      b.y += DIR[b.dir].dy;
      // 出界
      if (b.x < -BULLET || b.y < -BULLET || b.x > FIELD || b.y > FIELD) {
        b.alive = false;
        if (b.x < 0 || b.x > FIELD || b.y < 0 || b.y > FIELD) {
          // 在边界处产生火花
        }
        return;
      }
      // 命中墙壁
      const v = bulletHitTile(b.x + BULLET / 2, b.y + BULLET / 2);
      if (v === BRICK) {
        destroyBrick(b);
        return;
      } else if (v === STEEL) {
        AUDIO.hitWall();
        if (b.isPlayer) spark(b.x, b.y, '#fff');
        b.alive = false; return;
      } else if (v === BASE) {
        destroyBase();
        b.alive = false; return;
      } else if (v === WATER) {
        b.alive = false; return;
      }
      // 命中坦克
      if (b.isPlayer) {
        for (const e of enemies) {
          if (!e.alive) continue;
          if (hitTest(b, e)) { killEnemy(e); b.alive = false; return; }
        }
      } else {
        if (player && player.alive && playerInv <= 0 && hitTest(b, player)) {
          killPlayer(); b.alive = false; return;
        }
      }
    }
  }

  function hitTest(b, tank) {
    return b.x + BULLET > tank.x && b.x < tank.x + TANK &&
           b.y + BULLET > tank.y && b.y < tank.y + TANK;
  }

  function destroyBrick(b) {
    const c = Math.floor((b.x + BULLET / 2) / TILE);
    const r = Math.floor((b.y + BULLET / 2) / TILE);
    // 摧毁子弹进入方向上的第一块砖
    let cc = Math.floor(b.x / TILE), rr = Math.floor(b.y / TILE);
    if (c >= 0 && r >= 0 && c < COLS && r < ROWS) {
      cc = c; rr = r;
    }
    if (tileAt(cc, rr) === BRICK) {
      map[rr][cc] = EMPTY;
      spawnDebris(cc * TILE + TILE / 2, rr * TILE + TILE / 2, '#c0392b');
    } else {
      // 命中砖块边缘，找相邻砖块
      const nx = cc + (DIR[b.dir].dx > 0 ? 1 : DIR[b.dir].dx < 0 ? -1 : 0);
      const ny = rr + (DIR[b.dir].dy > 0 ? 1 : DIR[b.dir].dy < 0 ? -1 : 0);
      if (tileAt(nx, ny) === BRICK) { map[ny][nx] = EMPTY; spawnDebris(nx * TILE + TILE / 2, ny * TILE + TILE / 2, '#c0392b'); }
    }
    AUDIO.hitWall();
    b.alive = false;
  }

  function destroyBase() {
    if (map[ROWS - 1][6] === BASE) {
      map[ROWS - 1][6] = EMPTY;
      flashBase = 90;
      shake = 20;
      AUDIO.die();
      gameOver();
    }
  }

  // ---------- 击杀 / 死亡 ----------
  function killEnemy(e) {
    e.alive = false;
    score += 100;
    enemiesLeft = Math.max(0, enemiesLeft - 1);
    spawnExplosion(e.x + TANK / 2, e.y + TANK / 2, e.color);
    AUDIO.explode();
    updateHUD();
    if (enemiesLeft === 0 && spawnQueue.length === 0) {
      levelClear();
    }
  }

  function killPlayer() {
    player.alive = false;
    lives--;
    spawnExplosion(player.x + TANK / 2, player.y + TANK / 2, 0);
    AUDIO.explode();
    shake = 15;
    updateHUD();
    if (lives <= 0) {
      gameOver();
    } else {
      // 延迟重生
      player = null;
      setTimeout(() => { if (gameState === 'playing') spawnPlayer(); }, 1200);
    }
  }

  function levelClear() {
    gameState = 'levelclear';
    stateTimer = 160;
    AUDIO.levelClear();
    score += 500;
    updateHUD();
  }

  function gameOver() {
    gameState = 'over';
    stateTimer = 0;
    btnStart.textContent = '重新开始';
  }

  // ---------- 特效 ----------
  function spawnExplosion(cx, cy, colorIdx) {
    const colors = ['#f5c542', '#e67e22', '#e74c3c'];
    const col = colors[colorIdx] || '#fff';
    for (let i = 0; i < 22; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 1 + Math.random() * 4;
      particles.push({
        x: cx, y: cy,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 30 + Math.random() * 20,
        color: Math.random() < 0.5 ? col : '#ff9a00',
        size: 2 + Math.random() * 4,
      });
    }
  }

  function spawnDebris(cx, cy, color) {
    for (let i = 0; i < 8; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 1 + Math.random() * 3;
      particles.push({
        x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 20 + Math.random() * 15, color, size: 2 + Math.random() * 3,
      });
    }
  }

  function spark(x, y, color) {
    particles.push({ x, y, vx: 0, vy: 0, life: 8, color, size: 3 });
  }

  // ---------- 敌人 AI ----------
  function updateEnemy(e) {
    if (!e.alive) return;
    if (e.shootCooldown > 0) e.shootCooldown--;
    e.moveTick++;

    // 每过一段时间随机转向，或遇到障碍转向
    if (e.moveTick % 90 === 0 || Math.random() < 0.01) {
      e.dir = Math.floor(Math.random() * 4);
    }

    const nx = e.x + DIR[e.dir].dx * e.speed;
    const ny = e.y + DIR[e.dir].dy * e.speed;
    if (tankCanMove(nx, ny, e)) {
      e.x = nx; e.y = ny;
    } else {
      // 撞墙则换方向
      const dirs = [0, 1, 2, 3].filter(d => d !== e.dir && d !== (e.dir + 2) % 4);
      e.dir = dirs[Math.floor(Math.random() * dirs.length)];
    }

    // 随机射击
    if (e.shootCooldown <= 0 && Math.random() < 0.012) {
      fireBullet(e, false);
      e.shootCooldown = 40;
    }
  }

  function fireBullet(tank, isPlayer) {
    // 每个坦克同时最多 1 颗子弹（经典规则）
    if (bullets.filter(b => b.alive && b.isPlayer === isPlayer).length > 0) {
      // 玩家有子弹飞行中则不重复发射；敌人按坦克单独限制过于复杂，简化处理
    }
    if (isPlayer && bullets.some(b => b.alive && b.isPlayer)) return;
    const cx = tank.x + TANK / 2 - BULLET / 2;
    const cy = tank.y + TANK / 2 - BULLET / 2;
    const off = TANK / 2;
    const b = createBullet(
      tank.x + TANK / 2 - BULLET / 2 + DIR[tank.dir].dx * off,
      tank.y + TANK / 2 - BULLET / 2 + DIR[tank.dir].dy * off,
      tank.dir, isPlayer
    );
    bullets.push(b);
    AUDIO.shoot();
  }

  // ---------- 出生 ----------
  function spawnEnemyFromQueue() {
    if (spawnQueue.length === 0) return;
    const type = spawnQueue.shift();
    const spawnCols = [0, 6, 12];
    const col = spawnCols[Math.floor(Math.random() * spawnCols.length)];
    const x = col * TILE + (TILE - TANK) / 2;
    const y = 0 + (TILE - TANK) / 2;
    // 出生点被占则延后
    for (const e of enemies) {
      if (e.alive && Math.abs(e.x - x) < TANK && Math.abs(e.y - y) < TANK) {
        spawnQueue.unshift(type); return;
      }
    }
    const e = createTank(x, y, 2, false);
    e.type = type;
    // 类型加成
    if (type === 1) { e.speed = ENEMY_SPEED * 1.6; e.color = 3; }
    if (type === 2) { e.speed = ENEMY_SPEED * 0.9; e.color = 1; }
    e.spawnShield = 90; // 出生保护闪烁
    enemies.push(e);
    AUDIO.spawn();
    spawnTimer = 60;
  }

  // ---------- 关卡推进 ----------
  function nextLevel() {
    level++;
    resetRound();
    if (level > LEVELS.length) {
      // 循环地图，略微增强敌人速度
    }
  }

  function resetRound() {
    const lv = LEVELS[(level - 1) % LEVELS.length];
    map = decodeLevel(lv);
    enemies = [];
    bullets = [];
    particles = [];
    explosions = [];
    buildSpawnQueue();
    enemiesLeft = ENEMIES_PER_LEVEL;
    spawnTimer = 30;
    spawnPlayer();
    updateHUD();
  }

  function startGame() {
    level = 1;
    score = 0;
    lives = PLAYER_LIVES;
    resetRound();
    gameState = 'playing';
    btnStart.textContent = '重新开始';
    AUDIO.spawn();
    updateHUD();
  }

  // ---------- 输入 ----------
  window.addEventListener('keydown', e => {
    keys[e.key.toLowerCase()] = true;
    keys[e.code] = true;
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
    if (e.key.toLowerCase() === 'p' && gameState === 'playing') pauseGame();
    if (e.key.toLowerCase() === 'p' && gameState === 'paused') resumeGame();
    if ((e.key === ' ' || e.key.toLowerCase() === 'j') && gameState === 'playing') {
      if (player && player.alive) fireBullet(player, true);
    }
    if (e.key === 'Enter' && (gameState === 'menu' || gameState === 'over' || gameState === 'win')) startGame();
  });
  window.addEventListener('keyup', e => {
    keys[e.key.toLowerCase()] = false;
    keys[e.code] = false;
  });

  btnStart.addEventListener('click', startGame);
  btnPause.addEventListener('click', () => {
    if (gameState === 'playing') pauseGame();
    else if (gameState === 'paused') resumeGame();
  });

  function pauseGame() { gameState = 'paused'; btnPause.textContent = '继续'; }
  function resumeGame() { gameState = 'playing'; btnPause.textContent = '暂停'; }

  // ---------- 玩家更新 ----------
  function updatePlayer() {
    if (!player || !player.alive) return;
    if (playerInv > 0) playerInv--;

    let dx = 0, dy = 0, nd = player.dir;
    if (keys['w'] || keys['arrowup']) { dy = -1; nd = 0; }
    else if (keys['s'] || keys['arrowdown']) { dy = 1; nd = 2; }
    else if (keys['a'] || keys['arrowleft']) { dx = -1; nd = 3; }
    else if (keys['d'] || keys['arrowright']) { dx = 1; nd = 1; }

    if (dx || dy) {
      player.dir = nd;
      const nx = player.x + dx * player.speed;
      const ny = player.y + dy * player.speed;
      if (tankCanMove(nx, ny, player)) { player.x = nx; player.y = ny; }
      else if (tankCanMove(player.x + dx * player.speed, player.y, player)) { player.x += dx * player.speed; }
      else if (tankCanMove(player.x, player.y + dy * player.speed, player)) { player.y += dy * player.speed; }
    }
  }

  // ---------- HUD ----------
  function updateHUD() {
    elScore.textContent = score;
    elLevel.textContent = level;
    elLives.innerHTML = '';
    for (let i = 0; i < lives; i++) elLives.innerHTML += '<span></span>';
    elEnemies.innerHTML = '';
    const remaining = enemiesLeft + spawnQueue.length;
    for (let i = 0; i < remaining; i++) elEnemies.innerHTML += '<span></span>';
  }

  // ---------- 渲染 ----------
  function draw() {
    ctx.save();
    if (shake > 0) {
      ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
      shake *= 0.85;
    }

    // 背景
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, FIELD, FIELD);

    // 地图
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const v = map[r][c];
        const x = c * TILE, y = r * TILE;
        if (v === BRICK) drawBrick(x, y);
        else if (v === STEEL) drawSteel(x, y);
        else if (v === WATER) drawWater(x, y);
        else if (v === BASE) drawBase(x, y);
      }
    }

    // 基地闪烁
    if (flashBase > 0) {
      ctx.fillStyle = `rgba(255,60,60,${(flashBase / 90) * 0.6})`;
      ctx.fillRect(6 * TILE, 12 * TILE, TILE, TILE);
      flashBase--;
    }

    // 子弹
    for (const b of bullets) {
      if (!b.alive) continue;
      ctx.fillStyle = b.isPlayer ? '#ffe97a' : '#ff8c8c';
      ctx.fillRect(b.x, b.y, BULLET, BULLET);
    }

    // 敌人
    for (const e of enemies) {
      if (!e.alive) continue;
      drawTank(e.x, e.y, e.dir, e.color, e.spawnShield > 0);
      if (e.spawnShield > 0) e.spawnShield--;
    }

    // 玩家
    if (player && player.alive) {
      // 无敌闪烁
      if (playerInv <= 0 || Math.floor(playerInv / 4) % 2 === 0) {
        drawTank(player.x, player.y, player.dir, 0, false);
      }
    }

    // 粒子
    for (const p of particles) {
      p.x += p.vx; p.y += p.vy; p.life--;
      ctx.globalAlpha = Math.max(0, p.life / 40);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
      ctx.globalAlpha = 1;
    }
    particles = particles.filter(p => p.life > 0);

    ctx.restore();

    // 覆盖层
    if (gameState === 'menu') overlay('坦克大战', '按 回车 或点击「开始」', '经典 Battle City 风格');
    else if (gameState === 'over') overlay('游戏结束', `得分 ${score}`, '按 回车 重新开始');
    else if (gameState === 'win') overlay('你赢了！', `最终得分 ${score}`, '按 回车 再来一局');
    else if (gameState === 'levelclear') overlay(`第 ${level} 关 完成`, '+500 奖励分', '即将进入下一关…');
    else if (gameState === 'paused') overlay('已暂停', '', '按 P 继续');
  }

  function drawBrick(x, y) {
    ctx.fillStyle = '#b4472b';
    ctx.fillRect(x, y, TILE, TILE);
    ctx.fillStyle = '#8c3018';
    for (let i = 0; i < 2; i++) {
      ctx.fillRect(x + 2, y + 4 + i * 18, TILE - 4, 2);
      ctx.fillRect(x + 2, y + 10 + i * 18, TILE - 4, 2);
    }
    ctx.fillRect(x + 18, y + 2, 2, 8);
    ctx.fillRect(x + 8, y + 20, 2, 8);
    ctx.fillRect(x + 28, y + 12, 2, 8);
    ctx.fillRect(x + 12, y + 32, 2, 6);
  }

  function drawSteel(x, y) {
    ctx.fillStyle = '#9aa0a6';
    ctx.fillRect(x, y, TILE, TILE);
    ctx.fillStyle = '#e8eaed';
    ctx.fillRect(x + 4, y + 4, TILE - 8, TILE - 8);
    ctx.fillStyle = '#6b7075';
    ctx.fillRect(x + TILE / 2 - 4, y + TILE / 2 - 4, 8, 8);
    ctx.fillStyle = '#c8ccd0';
    ctx.fillRect(x + 8, y + 8, 8, 8);
    ctx.fillRect(x + TILE - 16, y + TILE - 16, 8, 8);
  }

  function drawWater(x, y) {
    ctx.fillStyle = '#1e5aa8';
    ctx.fillRect(x, y, TILE, TILE);
    ctx.fillStyle = '#3d7dd6';
    const t = Math.floor(Date.now() / 300) % 2;
    for (let i = 0; i < 3; i++) {
      const yy = y + 6 + i * 12 + t * 4;
      ctx.fillRect(x + 4, yy, TILE - 8, 4);
    }
  }

  function drawBase(x, y) {
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(x, y, TILE, TILE);
    // 老鹰标志（简化）
    ctx.fillStyle = '#f5c542';
    ctx.beginPath();
    ctx.moveTo(x + 8, y + 30);
    ctx.lineTo(x + 20, y + 8);
    ctx.lineTo(x + 32, y + 30);
    ctx.lineTo(x + 26, y + 30);
    ctx.lineTo(x + 24, y + 24);
    ctx.lineTo(x + 16, y + 24);
    ctx.lineTo(x + 14, y + 30);
    ctx.closePath();
    ctx.fill();
  }

  function drawTank(x, y, dir, colorIdx, shield) {
    ctx.save();
    ctx.translate(x + TANK / 2, y + TANK / 2);
    ctx.rotate(dir * Math.PI / 2);

    const palettes = [
      { body: '#f5c542', track: '#8a6d1a', light: '#ffe97a' },  // 玩家
      { body: '#e74c3c', track: '#7a1f1f', light: '#ff8c8c' },  // 敌人强化
      { body: '#a9b0b8', track: '#555b61', light: '#e0e4e8' },  // 敌人普通
      { body: '#e67e22', track: '#7a4010', light: '#ffb066' },  // 敌人快速
    ];
    const p = palettes[colorIdx] || palettes[0];
    const s = TANK;

    // 履带
    ctx.fillStyle = p.track;
    ctx.fillRect(-s / 2, -s / 2, s, 6);
    ctx.fillRect(-s / 2, s / 2 - 6, s, 6);
    // 履带纹理
    ctx.fillStyle = '#000';
    for (let i = -s / 2 + 3; i < s / 2 - 3; i += 6) {
      ctx.fillRect(i, -s / 2, 2, 6);
      ctx.fillRect(i, s / 2 - 6, 2, 6);
    }
    // 车身
    ctx.fillStyle = p.body;
    ctx.fillRect(-s / 2 + 3, -s / 2 + 6, s - 6, s - 12);
    // 炮塔
    ctx.fillStyle = p.light;
    ctx.fillRect(-s / 4, -s / 4, s / 2, s / 2);
    ctx.fillStyle = p.body;
    ctx.fillRect(-s / 6, -s / 6, s / 3, s / 3);
    // 炮管
    ctx.fillStyle = p.light;
    ctx.fillRect(-3, -s / 2, 6, s / 4);

    if (shield) {
      ctx.strokeStyle = 'rgba(255,255,255,' + (0.4 + Math.sin(Date.now() / 60) * 0.3) + ')';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 0, s / 2 + 4, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.restore();
  }

  function overlay(title, sub, foot) {
    ctx.fillStyle = 'rgba(0,0,0,0.72)';
    ctx.fillRect(0, 0, FIELD, FIELD);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#f5c542';
    ctx.font = 'bold 40px "Segoe UI", "Microsoft YaHei", sans-serif';
    ctx.fillText(title, FIELD / 2, FIELD / 2 - 30);
    ctx.fillStyle = '#e8e8e8';
    ctx.font = '22px "Segoe UI", "Microsoft YaHei", sans-serif';
    ctx.fillText(sub, FIELD / 2, FIELD / 2 + 20);
    ctx.fillStyle = '#888';
    ctx.font = '16px "Segoe UI", "Microsoft YaHei", sans-serif';
    ctx.fillText(foot, FIELD / 2, FIELD / 2 + 60);
  }

  // ---------- 主循环 ----------
  function update() {
    if (gameState === 'playing') {
      updatePlayer();
      for (const e of enemies) updateEnemy(e);
      for (const b of bullets) updateBullet(b);
      bullets = bullets.filter(b => b.alive);
      enemies = enemies.filter(e => e.alive);

      // 敌人生成
      if (spawnTimer > 0) spawnTimer--;
      if (spawnQueue.length > 0 && enemies.filter(e => e.alive).length < MAX_ALIVE_ENEMY && spawnTimer <= 0) {
        spawnEnemyFromQueue();
      }
    } else if (gameState === 'levelclear') {
      stateTimer--;
      for (const b of bullets) updateBullet(b);
      bullets = bullets.filter(b => b.alive);
      if (stateTimer <= 0) {
        nextLevel();
        gameState = 'playing';
      }
    }
  }

  function loop(ts) {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  // 初始化
  map = decodeLevel(LEVELS[0]);
  updateHUD();
  requestAnimationFrame(loop);
})();
</script>
</body>
